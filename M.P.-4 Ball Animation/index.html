<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .contain{
            height: 600px;
            width: 800px;
            background-color: cyan;
            border: 2px solid blue;
            position: relative;
        }
        .item{
            height: 60px;
            width: 60px;
            border-radius: 60px;
            color: aliceblue;
            background-color: magenta;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: moveX 2.5s linear infinite alternate,
                        moveY 500ms ease-out infinite alternate;
        }

        @keyframes moveX{
            from{
                left: 0;
            }
            to{
                left: calc(100% - 60px);
            }
        }

        @keyframes moveY{
            from{
                bottom: 0;
            }
            to{
                bottom: calc(70% - 60px);
            }
        }
    </style>
</head>
<body>
    <div class="contain">
        <div class="item">
            O
        </div>
    </div>
</body>
</html>
